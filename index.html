/* Power Apps Canvas / Microsoft Fluent inspired working-demo presentation.
   This is a browser prototype, not a native Power Apps .msapp package. */
:root {
  --navy:#482783;
  --navy2:#6037a3;
  --bg:#f5f6fa;
  --ink:#262336;
  --muted:#6c7080;
  --line:#e4e4ed;
  --white:#ffffff;
  --green:#17895c;
  --teal:#6844ad;
  --blue:#4b6cae;
  --amber:#c28527;
  --red:#bb4d58;
  --shadow:0 1px 3px rgba(28,24,48,.035);
  --radius:9px;
  --fluent:#6638b4;
  --fluent-dark:#482783;
}
html,body{min-height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI',Arial,sans-serif;font-size:13px;}
button, input, select, textarea{font-family:'Segoe UI',Arial,sans-serif}
#app{min-height:100vh}
/* Left side is an application's page list, not a dashboard marketing sidebar. */
.sidebar{background:#fff;border-right:1px solid #e0e0e9;color:#393b49;padding:0 0 13px;width:238px;box-shadow:none}
.brand{height:72px;min-height:72px;background:#47257e;color:white;padding:0 19px;border:0;gap:11px}
.brand-mark{height:37px;width:37px;border-radius:7px;background:#2cb66d;color:white;font-size:22px;box-shadow:none}
.brand-name{font-family:'Segoe UI',Arial,sans-serif;font-size:16px;letter-spacing:.2px;font-weight:750}
.brand small{font-family:'Segoe UI',Arial,sans-serif;color:#ded3f6;font-size:10px;letter-spacing:.75px;white-space:nowrap}
.sidebar-scroll{padding:12px 10px 12px}
.nav-section{letter-spacing:.85px;font-weight:750;font-size:10px;color:#777485;margin:19px 10px 7px;line-height:1.4}
.nav-item{color:#4e4f5c;font-size:12.8px;font-weight:590;margin:1px 0;border-radius:6px;padding:10px 12px;gap:12px;min-height:40px}
.nav-item .ico{color:#6b657a}
.nav-item:hover{background:#f5f2fb;color:#472a80}
.nav-item.active{background:#eee8f9;color:#5931a1;box-shadow:inset 3px 0 #7347c3;font-weight:750}
.nav-item.active .ico{color:#6e40b9}
.sidebar-bottom{border-top:1px solid #e8e6ef;color:#878393;font-size:11px;padding:13px 19px 0}
.sidebar-bottom strong{color:#575465}
.stage-foot{margin-top:8px}
.stage-dot{background:#23aa64}
.sidebar-bottom .button.ghost{background:#f7f5fb;border-color:#e3dfee;color:#593a90;justify-content:center!important}
.main{margin-left:238px;width:calc(100% - 238px);}
/* The app header is deliberately dense and in-app, akin to a Canvas app. */
.topbar{height:72px;background:#47257e;border-bottom:0;color:white;padding:0 28px;box-shadow:0 2px 4px rgba(48,23,82,.08)}
.crumb{color:#ece5fa;gap:10px;font-size:12px;min-width:0}
.crumb strong{color:#fff;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .app-screen-icon{height:34px;width:34px;border-radius:7px;display:grid;place-items:center;background:#ffffff1d;color:white;font-size:18px;font-weight:700}
.crumb .app-name{font-weight:740;font-size:14px;color:white}
.crumb .crumb-separator{font-size:15px;color:#bea5e3;margin:0 3px}
.top-actions{gap:9px}
.demo-pill{border:1px solid #c9b3e94d;background:#f8f3ff17;color:#e6dcf9;letter-spacing:.5px;border-radius:5px;font-size:10px;padding:6px 9px;font-weight:750;white-space:nowrap}
.select-compact{background:#fff;border:1px solid #d9c9ed;border-radius:5px;color:#473265;font-size:11.5px;font-weight:650;padding:8px 10px}
.lang-select{min-width:70px}
.avatar{background:#def5e8;box-shadow:0 0 0 1px #cde5d8;color:#167d4a;width:34px;height:34px}

const localizedShort=x=>statusTranslations[lang]?.[x]||uiLexicon[lang]?.[x]||x;
function localizeUI(root){document.documentElement.lang=lang;if(!root)return;if(lang==='lt'){decorateMobileTables(root);return;}
 const d=uiLexicon[lang];const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let node;while(node=walker.nextNode()){
  const v=node.nodeValue,a=v.trim();if(!a)continue;
  const translated=d[a]||statusTranslations[lang]?.[a];
  if(translated)node.nodeValue=v.replace(a,translated);
  else if(/^[+-]?[0-9., ]+ vnt\.$/.test(a))node.nodeValue=v.replace('vnt.',lang==='en'?'pcs.':'шт.');
 }
 root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{for(const attr of ['placeholder','title','aria-label']){const value=el.getAttribute(attr);if(!value)continue;if(d[value])el.setAttribute(attr,d[value]);}});
 decorateMobileTables(root);
}
function decorateMobileTables(root){root.querySelectorAll('table.data-table').forEach(table=>{const heads=[...table.querySelectorAll('thead th')].map(x=>x.textContent.trim());table.querySelectorAll('tbody tr').forEach(row=>{[...row.children].forEach((cell,i)=>{if(cell.matches('td'))cell.setAttribute('data-label',heads[i]||'');});});});}

// Non-destructive migration of earlier demo data, including countries and product photos.
function syncCountries(){if(!Array.isArray(data.countries)){data.countries=countryList.map(code=>({code,name:countryNames[code]}));}
  countryList.splice(0,countryList.length);Object.keys(countryNames).forEach(k=>delete countryNames[k]);
  data.countries.forEach(c=>{if(c.code&&c.name){countryList.push(c.code);countryNames[c.code]=c.name;}});
}
syncCountries();
for(const p of data.products){if(builtInProductPhotos[p.id]&&(!p.photo||/^data:image\/svg\+xml/.test(p.photo)))p.photo=productPhoto(p.id);}
for(const sale of data.sales||[]){if(!Number.isFinite(sale.unitCostAtSale)){sale.unitCostAtSale=(data.costs||[]).filter(c=>c.productId===sale.productId).reduce((a,c)=>a+Number(c.unitCost)*Number(c.qty||1),0)||Number(data.products.find(p=>p.id===sale.productId)?.baseCost||0);sale.costEstimated=true;}}

const persist=()=>{try{localStorage.setItem(STORE,JSON.stringify(data));}catch(e){toast('Naršyklės atmintis užpildyta. Sumažinkite nuotraukos dydį.',true);}};
const prod=id=>data.products.find(x=>x.id===id), loc=id=>data.locations.find(x=>x.id===id), ord=id=>data.orders.find(x=>x.id===id);
const stock=(p,l)=>data.openings.filter(x=>x.p===p&&x.l===l).reduce((a,x)=>a+x.qty,0)+data.moves.reduce((a,x)=>a+(x.productId!==p?0:(x.to===l?x.qty:0)-(x.from===l?x.qty:0)),0);
const totalStock=p=>data.locations.reduce((a,l)=>a+stock(p,l.id),0);
const costPerUnit=p=>{let rows=data.costs.filter(c=>c.productId===p);return rows.length?rows.reduce((a,c)=>a+Number(c.unitCost)*Number(c.qty||1),0):Number(prod(p)?.baseCost||0)};

function head(title,description,action='',phase=1){return `<div class="page-header"><div><div class="eyebrow">PRODIVI / ${phase===1?t('stage1'):t('stage2')}</div><h1 class="page-title">${esc(title)}</h1><p class="subtitle">${esc(description)}</p></div>${action}</div>`;}
function metric(title,value,detail,iconName,kind=''){return `<div class="metric ${kind}"><div class="metric-top"><span>${esc(title)}</span><span class="metric-icon">${ic(iconName)}</span></div><div class="metric-number">${esc(String(value))}</div><div class="metric-note">${esc(detail)}</div></div>`;}

function render(){if(role==='employee'&&nav.find(n=>n.id===page)?.fin)page='dashboard';const navItems=phase=>nav.filter(n=>n.phase===phase&&!(role==='employee'&&n.fin)).map(n=>`<button data-page="${n.id}" class="nav-item ${page===n.id?'active':''}">${ic(n.ic)}<span>${esc(t(n.id))}</span></button>`).join('');let item=nav.find(n=>n.id===page)||nav[0];let html='';try{html=({dashboard:renderDashboard,products:renderProducts,orders:renderOrders,production:renderProduction,stock:renderStock,movements:renderMovements,costs:renderCosts,expenses:renderExpenses,reports:renderReports,catalog:renderCatalog,qr:renderQR,tasks:renderTasks})[page]();}catch(e){console.error(e);html='<div class="panel panel-pad">Nepavyko atvaizduoti puslapio. Atkurkite demonstracinius duomenis arba atnaujinkite puslapį.</div>';}document.querySelector('#app').innerHTML=`${mobileMenu?'<div class="sidebar-scrim" data-action="close-menu"></div>':''}<aside class="sidebar ${mobileMenu?'visible':''}"><div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">PRODIVI</div><small>POWER APPS TIPO PROTOTIPAS</small></div></div><div class="sidebar-scroll"><div class="nav-section">${t('stage1')}</div>${navItems(1)}<div class="nav-section">${t('stage2')}</div>${navItems(2)}</div><div class="sidebar-bottom"><strong>${t('stageDemo')}</strong><div class="stage-foot"><span class="stage-dot"></span>Veikia demonstracinėje aplinkoje</div><button style="margin-top:14px;width:100%;justify-content:flex-start" class="button ghost small" data-action="reset">${ic('refresh',15)} ${t('reset')}</button></div></aside><div class="main"><header class="topbar"><div class="crumb"><button class="mobile-menu" data-action="toggle-menu">${ic('menu')}</button><span class="app-screen-icon">▦</span><span class="app-name">Suvenyrų valdymas</span><span class="crumb-separator">/</span><strong>${esc(t(page))}</strong></div><div class="top-actions"><span class="demo-pill">● DEMO APLINKA</span><select id="role-select" class="select-compact" title="Demonstracinė rolė">${option('manager',t('manager'),role)}${option('employee',t('employee'),role)}</select><select id="lang-select" class="select-compact lang-select" title="Kalba">${option('lt','LT',lang)}${option('en','EN',lang)}${option('ru','RU',lang)}</select><span class="avatar">PD</span></div></header><main class="content">${html}<p class="footnote" style="margin-top:30px">DEMO · Demonstraciniai duomenys saugomi tik šioje naršyklėje. „Microsoft 365“, „SharePoint“ ir „Power Automate“ ryšys čia neįdiegtas.</p></main></div>`;localizeUI(document.querySelector('#app'));}

function renderDashboard(){const active=data.orders.filter(o=>o.status!=='Pagaminta').length;const being=data.production.filter(g=>g.status==='Gaminama').length;const stocked=data.products.reduce((s,p)=>s+totalStock(p.id),0);const transit=data.moves.filter(m=>m.type==='transfer').reduce((s,m)=>s+m.qty,0);const recent=data.moves.slice().sort((a,b)=>b.at.localeCompare(a.at)).slice(0,5);return `${head(t('dashboard'),t('subtitle'),badgePhase(1))}<div class="workflow"><span class="step">${t('products')}</span><span class="arrow">›</span><span class="step">${t('orders')}</span><span class="arrow">›</span><span class="step">${t('production')}</span><span class="arrow">›</span><span class="step">${t('stock')}</span><span class="arrow">›</span><span class="step">${t('movements')}</span></div><div class="cards4">${metric('Aktyvūs užsakymai',active,'Laukia / gaminama','list')}${metric('Gamyboje',being,'Šiuo metu vykdomi darbai','factory','blue')}${metric('Faktiniai likučiai',num(stocked)+' vnt.','Visose buvimo vietose','box','orange')}${metric('Perduoti kiekiai',num(transit)+' vnt.','Pagal registruotus perdavimus','truck','purple')}</div><div class="cols-2 section-space"><div class="panel"><div class="panel-head"><div><h2 class="panel-title">Gamybos eiga</h2><div class="panel-sub">Planuojami, gaminami ir pagaminti kiekiai</div></div><button class="panel-link" data-page="production">Visi darbai →</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Produktas</th><th>Užsakymas</th><th>Būsena</th><th>Kiekiai</th></tr></thead><tbody>${data.production.slice(0,5).map(g=>`<tr><td class="bold">${esc(prod(g.productId)?.name||'')}</td><td>${esc(g.orderId)}</td><td>${statusTag(g.status)}</td><td><b>${g.completed}</b> / ${g.planned}</td></tr>`).join('')}</tbody></table></div></div><div class="panel panel-pad"><div class="split-title"><div><h2 class="panel-title">Greiti veiksmai</h2><div class="panel-sub">Dažniausi darbo scenarijai</div></div>${badgePhase(1)}</div><div class="quickgrid">${canManage()?`<button class="quick" data-modal="order"><span class="qico">${ic('plus')}</span>${t('addOrder')}</button>`:''}<button class="quick" data-modal="production"><span class="qico">${ic('factory')}</span>Atnaujinti gamybą</button><button class="quick" data-modal="transfer"><span class="qico">${ic('truck')}</span>${t('addTransfer')}</button><button class="quick" data-page="qr"><span class="qico">${ic('qr')}</span>QR produktui</button></div><div class="divider"></div><div class="split-title"><h2 class="panel-title">Kur yra produkcija?</h2><button class="panel-link" data-page="stock">Visi likučiai →</button></div><ul class="shortlist">${data.locations.slice(0,4).map(l=>`<li><span>${esc(l.name)}</span><strong>${num(data.products.reduce((sum,p)=>sum+stock(p.id,l.id),0))} vnt.</strong></li>`).join('')}</ul></div></div><div class="panel section-space"><div class="panel-head"><div><h2 class="panel-title">Naujausi judėjimai</h2><div class="panel-sub">Kas, kada ir kam perdavė produktus</div></div><button class="panel-link" data-page="movements">Žiūrėti istoriją →</button></div><div class="table-scroll"><table class="data-table"><thead><tr><th>Data</th><th>Produktas</th><th>Operacija</th><th>Kiekis</th><th>Atsakingas</th></tr></thead><tbody>${recent.map(m=>`<tr><td>${date(m.at)}</td><td class="bold">${esc(prod(m.productId)?.name)}</td><td>${esc(moveLabel(m))}</td><td>${m.qty} vnt.</td><td>${esc(m.by)}</td></tr>`).join('')}</tbody></table></div></div>`;}
function renderProducts(){let items=byFilter(data.products,p=>`${p.name} ${p.sku} ${p.tags.join(' ')} ${p.countries.join(' ')}`).filter(p=>!filters.country||p.countries.includes(filters.country));return `${head(t('products'),'Suvenyrų registras, nuotraukos, kainos, šalys ir produkto žymos',`${canManage()?`<button class="button primary" data-modal="product">${ic('plus',16)}${t('addProduct')}</button>`:''}`)}<div class="toolbar"><input class="field-search" data-filter="query" placeholder="${t('search')} · pavadinimas, kodas, žyma" value="${esc(filters.query)}"><select class="field-select" data-filter="country">${countryOptions(filters.country)}</select><span class="spacer"></span>${canManage()?`<button class="button secondary small" data-modal="tags">${ic('tags',15)} Žymos ir šalys</button>`:''}<span class="view-switch"><button data-action="set-view" data-view="tiles" class="${filters.view==='tiles'?'active':''}">Kortelės</button><button data-action="set-view" data-view="table" class="${filters.view==='table'?'active':''}">Sąrašas</button></span></div>${items.length?(filters.view==='tiles'?`<div class="tilegrid">${items.map(p=>`<div class="product-tile" data-action="view-product" data-id="${p.id}"><div class="product-visual"><img src="${esc(p.photo)}" alt=""></div><div class="product-tile-content"><div class="product-tile-title">${esc(p.name)}</div><div class="subline">${esc(p.sku)} · ${p.countries.join(', ')}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px"><span class="badge teal">${totalStock(p.id)} vnt. likutis</span><strong>${money(p.price)}</strong></div><div class="tags" style="margin-top:11px">${p.tags.slice(0,3).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div></div>`).join('')}</div>`:`<div class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>${t('products')}</th><th>${t('country')}</th><th>Žymos</th><th>${t('cost')}</th><th>${t('price')}</th><th>${t('inStock')}</th>< function reportData(){
 const c=filters.reportCountry,p=filters.reportProduct,e=filters.reportEmployee.trim().toLocaleLowerCase();
 const dimensional=!!(c||p||e);
 const moves=data.moves.filter(m=>reportIn(m.at)&&(!p||m.productId===p)&&(!e||m.by.toLocaleLowerCase().includes(e)));
 const productionQty=c?null:moves.filter(m=>m.type==='production').reduce((s,m)=>s+m.qty,0);
 const transferQty=moves.filter(m=>m.type==='transfer'&&(!c||loc(m.to)?.country===c)).reduce((sum,m)=>sum+m.qty,0);
 const sales=data.sales.filter(s=>reportIn(s.date)&&(!c||s.country===c)&&(!p||s.productId===p)&&(!e||s.by.toLocaleLowerCase().includes(e)));
 const sold=sales.reduce((sum,s)=>sum+s.qty,0);
 const revenue=sales.reduce((sum,s)=>sum+s.qty*Number(s.unitPrice),0);
 const productionCost=sales.reduce((sum,s)=>sum+s.qty*Number(s.unitCostAtSale??costPerUnit(s.productId)),0);
 const gross=revenue-productionCost;
 const overheadPeriod=data.expenses.filter(x=>reportIn(x.date)).reduce((sum,x)=>sum+Number(x.amount),0);
 const stockTotal=data.products.filter(x=>!p||x.id===p).reduce((sum,product)=>sum+data.locations.filter(l=>(!c||l.country===c)&&(!e||l.name.toLocaleLowerCase().includes(e))).reduce((v,l)=>v+stock(product.id,l.id),0),0);
 return {productionQty,transferQty,sold,revenue,productionCost,overhead:dimensional?null:overheadPeriod,overheadPeriod,gross,profit:dimensional?null:gross-overheadPeriod,stockTotal,sales,dimensional,estimatedCosts:sales.some(s=>s.costEstimated)};
}

// Short, stable QR payloads: never copy long sandbox preview query parameters.
// On a real published website the code opens the product card directly.
// In an embedded/local preview it contains the product SKU, to scan inside this demo.
function qrUrl(p){
  const fallback='GRAVADA:'+p.sku;
  try{
    const u=new URL(location.href);
    const isPreview=/(^|\.)oaiusercontent\.com$/i.test(u.hostname)||/(^|\.)localhost$/i.test(u.hostname)||/^(127\.0\.0\.1|0\.0\.0)$/i.test(u.hostname);
    if(!/^https?:$/.test(u.protocol)||isPreview)return fallback;
    // Keep a clean canonical link; do not include the preview app, locale or render parameters.
    u.search='';u.hash='';u.searchParams.set('product',p.id);u.hash='products';
    if(new TextEncoder().encode(u.href).length<=134)return u.href;
  }catch(e){}

function resizedImage(file){return new Promise((res,rej)=>{let reader=new FileReader();reader.onerror=rej;reader.onload=()=>{const im=new Image();im.onload=()=>{const ratio=Math.min(1,900/im.width,640/im.height);const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*ratio));canvas.height=Math.max(1,Math.round(im.height*ratio));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);res(canvas.toDataURL('image/jpeg',.77));};im.onerror=rej;im.src=reader.result;};reader.readAsDataURL(file);});}

async function printCatalog(){
 const items=catalogProducts();if(!items.length){toast('Nėra produktų katalogui.',true);return;}
 try{
  const sheets=[];const W=1240,H=1754;
  function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){const words=String(text||'').split(/\s+/);let line='',lines=0;
   for(const word of words){if(ctx.measureText(line+' '+word).width>maxWidth&&line){ctx.fillText(line,x,y);y+=lineHeight;lines++;line='';if(lines>=maxLines)return y;}line+=(line?' ':'')+word;}
   if(line)ctx.fillText(line,x,y);return y+lineHeight;
  }
  for(let start=0;start<items.length;start+=4){
   const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
   ctx.fillStyle='#48277e';ctx.fillRect(0,0,W,150);ctx.fillStyle='#fff';ctx.font='bold 43px Arial';ctx.fillText('PRODUKTŲ KATALOGAS',72,90);
   ctx.font='21px Arial';ctx.fillStyle='#e4d7f8';ctx.fillText(new Date().toLocaleDateString('lt-LT')+'  ·  '+(filters.catalogCountry?countryNames[filters.catalogCountry]:'Visos šalys')+(filters.catalogTag?'  ·  '+filters.catalogTag:''),74,128);
   for(let i=0;i<4;i++){
    const p=items[start+i];if(!p)break;
    const col=i%2,row=Math.floor(i/2),x=70+col*565,y=198+row*725;
    ctx.fillStyle='#faf9fc';ctx.fillRect(x,y,535,680);ctx.strokeStyle='#e4deed';ctx.lineWidth=2;ctx.strokeRect(x,y,535,680);
    const pic=new Image();pic.src=p.photo;try{await pic.decode();}catch(e){}
    if(pic.complete&&pic.naturalWidth){const cover=Math.max(505/pic.naturalWidth,435/pic.naturalHeight);const dw=pic.naturalWidth*cover,dh=pic.naturalHeight*cover;
     ctx.save();ctx.beginPath();ctx.rect(x+15,y+15,505,435);ctx.clip();ctx.drawImage(pic,x+15+(505-dw)/2,y+15+(435-dh)/2,dw,dh);ctx.restore();}
    ctx.fillStyle='#292239';ctx.font='bold 27px Arial';wrap(ctx,p.name,x+25,y+505,480,34,2);
    ctx.fillStyle='#777083';ctx.font='20px Arial';ctx.fillText(p.sku+' · '+p.countries.join(', '),x+25,y+559);
    ctx.fillStyle='#726985';ctx.font='19px Arial';wrap(ctx,p.desc,x+25,y+592,475,24,2);
    ctx.fillStyle='#6734a4';ctx.font='bold 29px Arial';ctx.fillText(money(p.price),x+25,y+648);
   }
   ctx.strokeStyle='#e6e1ef';ctx.beginPath();ctx.moveTo(70,1692);ctx.lineTo(1170,1692);ctx.stroke();
   ctx.fillStyle='#82788b';ctx.font='17px Arial';ctx.fillText('DEMONSTRACINIS KATALOGAS · PRODIVI',72,1720);ctx.textAlign='right';ctx.fillText('Puslapis '+(sheets.length+1),1166,1720);ctx.textAlign='left';
   const base64=canvas.toDataURL('image/jpeg',.80).split(',')[1];const bytes=Uint8Array.from(atob(base64),c=>c.charCodeAt(0));sheets.push({bytes,width:W,height:H});
  }
  const pdf=makeImagePDF(sheets);
  const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
  const a=document.createElement('a');a.href=url;a.download='PRODIVI_produktu_katalogas_'+days(0)+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('Produktų katalogas atsisiųstas PDF formatu.');
 }catch(err){console.error(err);toast('Nepavyko sugeneruoti PDF: '+(err.message||'klaida'),true);}
}
function makeImagePDF(sheets){
 const enc=new TextEncoder(),parts=[],offsets=[0];let pos=0;
 function put(v){const buf=typeof v==='string'?enc.encode(v):v;parts.push(buf);pos+=buf.byteLength;}
 function obj(id,front,bytes=null,back=''){offsets[id]=pos;put(id+' 0 obj\n'+front);if(bytes)put(bytes);put(back+'\nendobj\n');}
 const count=2+sheets.length*3;
 put('%PDF-1.4\n%\xC2\xA5\xC2\xB6\n');
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Count '+sheets.length+' /Kids ['+sheets.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>');
 sheets.forEach((im,i)=>{const pageId=3+3*i,streamId=pageId+1,imgId=pageId+2;
  obj(pageId,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Pic ${imgId} 0 R >> >> /Contents ${streamId} 0 R >>`);
  const commands='q 595.28 0 0 841.89 0 0 cm /Pic Do Q';obj(streamId,`<< /Length ${commands.length} >>\nstream\n${commands}\nendstream`);
  obj(imgId,`<< /Type /XObject /Subtype /Image /Width ${im.width} /Height ${im.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,'\nendstream');
 });
 const xref=pos;put(`xref\n0 ${count+1}\n0000000000 65535 f \n`);
 for(let i=1;i<=count;i++)put(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 put(`trailer\n<< /Size ${count+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
 const total=new Uint8Array(pos);let offset=0;for(const p of parts){total.set(p,offset);offset+=p.length;}return total;
}
async function startCamera(){const video=document.querySelector('#scan-video'),output=document.querySelector('#scan-message');if(!video)return;if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector' in window)){output.textContent='Ši naršyklė nepalaiko QR skenavimo. Įveskite produkto kodą rankiniu būdu.';return;}try{const detector=new BarcodeDetector({formats:['qr_code']});qrStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});video.srcObject=qrStream;video.hidden=false;output.textContent='Nukreipkite kamerą į QR kodą.';qrLoop=setInterval(async()=>{if(!video||video.readyState<2)return;try{const found=await detector.detect(video);if(found?.length)handleScan(found[0].rawValue);}catch(e){}},400);}catch(e){output.textContent='Kameros pasiekti nepavyko. Patikrinkite leidimus arba įveskite kodą.';}}

try{const u=new URL(input);if(/^https?:$/.test(u.protocol))id=u.searchParams.get('product')||'';}catch(e){}

const p=data.products.find(p=>p.id===id||p.sku.toLowerCase()===sku||p.name.toLowerCase()===input.toLowerCase());

closeModal();page='products';render();viewProduct(p.id);}

document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-page],[data-modal]');if(!el){if(e.target.dataset.overlay)closeModal();return;}const action=el.dataset.action;if(el.dataset.page){navigate(el.dataset.page);return;}if(el.dataset.modal){openModal(el.dataset.modal,el.dataset.id||'',el.dataset.p||'',el.dataset.l||'');return;}if(action==='close-modal')closeModal();else if(action==='toggle-menu'){mobileMenu=!mobileMenu;render();}else if(action==='close-menu'){mobileMenu=false;render();}else if(action==='view-product')viewProduct(el.dataset.id);else if(action==='view-order')viewOrder(el.dataset.id);else if(action==='view-qr')viewQR(el.dataset.id);else if(action==='set-view'){filters.view=el.dataset.view;render();}else if(action==='add-order-line')document.querySelector('#order-lines')?.insertAdjacentHTML('beforeend',orderLine());else if(action==='remove-order-line'){const rows=document.querySelectorAll('#order-lines .line-editor');if(rows.length>1)el.closest('.line-editor').remove();else toast('Bent vienas produktas būtinas.',true);}else if(action==='print-catalog')printCatalog();else if(action==='start-camera')startCamera();else if(action==='manual-scan')handleScan(document.querySelector('#manual-scan').value.trim());else if(action==='reset'){if(confirm('Atkurti pradinius demonstracinius duomenis? Jūsų pakeitimai šioje naršyklėje bus panaikinti.')){data=seed();filters={query:'',country:'',status:'',product:'',location:'',reportCountry:'',reportProduct:'',reportEmployee:'',reportFrom:days(-30),reportTo:days(1),catalogCountry:'',catalogTag:'',view:'tiles'};syncCountries();persist();navigate('dashboard');toast('Demo duomenys atkurti.');}}else if(action==='delete-country'){if(!canManage())return toast('Keisti klasifikatorių gali tik vadovas.',true);const code=el.dataset.code;
const inUse=data.products.some(p=>p.countries.includes(code))||data.orders.some(o=>o.country===code)||data.locations.some(l=>l.country===code)||data.sales.some(s=>s.country===code);
if(inUse)return toast('Šalis jau naudojama produktuose, užsakymuose arba judėjimuose.',true);
if(data.countries.length<=1)return toast('Negalima ištrinti paskutinės šalies.',true);
data.countries=data.countries.filter(c=>c.code!==code);syncCountries();persist();openModal('countries');toast('Šalis pašalinta.');
}else if(action==='delete-tag'){if(!canManage())return toast('Keisti žymas gali tik vadovas.',true);const tag=el.dataset.tag;if(data.tags.includes(tag)){data.tags=data.tags.filter(x=>x!==tag);data.products.forEach(p=>p.tags=p.tags.filter(x=>x!==tag));persist();openModal('tags');toast('Žyma pašalinta.');}}});
